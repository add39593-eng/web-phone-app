<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Phone App</title>
  <style>
    :root {
      --primary: #007aff;
      --success: #34c759;
      --danger: #ff3b30;
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --text-secondary: #8e8e93;
      --border: #e5e5ea;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      color: var(--text);
      overflow: hidden;
    }

    .phone-container {
      width: 100%;
      height: 100%;
      max-width: 430px;
      max-height: 100vh;
      max-height: 100dvh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      border-radius: 0;
      box-shadow: none;
      border: none;
    }

    @media (min-width: 431px) {
      body { background: #f2f2f7; }
      .phone-container {
        height: 850px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      }
    }

    .screen {
      display: none;
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      box-sizing: border-box;
      padding-bottom: 75px;
    }
    .active-screen { display: flex; flex-direction: column; }

    h3 {
      font-size: 20px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 8px;
    }

    /* ボトムナビゲーション */
    .nav-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }
    .nav-item {
      background: none;
      border: none;
      font-size: 11px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-item.active-tab { color: var(--primary); font-weight: 600; }

    /* ログイン画面 */
    #login-screen {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--card-bg);
      z-index: 20;
      padding: 40px 24px;
      box-sizing: border-box;
      text-align: center;
    }
    #login-screen.active { display: flex; flex-direction: column; justify-content: center; align-items: center; }

    /* ダイヤルパッドのバランス調整 */
    .dial-screen-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 10px;
    }
    .display-number {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 8px;
      height: 36px;
      color: var(--text);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 250px;
      margin-bottom: 10px;
    }
    .key {
      width: 62px; height: 62px;
      border-radius: 50%;
      border: none;
      background: #f1f2f6;
      font-size: 22px;
      font-weight: 400;
      color: var(--text);
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      margin: 0 auto;
      transition: background 0.1s;
    }
    .key:active { background: #d1d5db; }
    .call-action-btn {
      width: 62px; height: 62px;
      border-radius: 50%;
      border: none;
      background: var(--success);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
    }
    .delete-key { background: transparent; color: var(--text-secondary); font-size: 18px; }

    /* 入力フォーム・ボタン */
    input, button { font-family: inherit; }
    .input-field {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 0;
      box-sizing: border-box;
      margin-bottom: 10px;
      background: #fafafa;
      outline: none;
    }
    .input-field:focus { border-color: var(--primary); background: #fff; }

    .btn {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 0;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }

    /* リストデザイン */
    .card-list { list-style: none; padding: 0; margin: 0; }
    .card-item {
      background: #fafafa;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 0;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* オーバーレイ (着信・通話中) */
    #incoming-overlay, #incall-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      color: white;
      z-index: 30;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px 24px;
      box-sizing: border-box;
      text-align: center;
    }
    #incall-overlay { background: #1c1c1e; }
  </style>
</head>
<body>

  <div class="phone-container">

    <!-- 【ログイン・初回設定画面】 -->
    <div id="login-screen">
      <div style="font-size: 44px; margin-bottom: 8px;">📞</div>
      <h2>番号の設定</h2>
      <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 20px;">数字のみを入力してください（自動で形になります）</p>
      <input type="text" id="login-num-input" class="input-field" placeholder="例: 00112123" maxlength="8" style="text-align: center; font-weight: bold;">
      <button id="login-btn" class="btn btn-primary" style="margin-top: 8px;">設定してはじめる</button>
    </div>

    <!-- 【画面1：発信画面】 -->
    <div id="screen-dial" class="screen active-screen">
      <h3>キーパッド</h3>
      <div class="dial-screen-inner">
        <div class="display-number" id="dial-display"></div>
        
        <div class="keypad">
          <button class="key" onclick="pressKey('1')">1</button>
          <button class="key" onclick="pressKey('2')">2</button>
          <button class="key" onclick="pressKey('3')">3</button>
          <button class="key" onclick="pressKey('4')">4</button>
          <button class="key" onclick="pressKey('5')">5</button>
          <button class="key" onclick="pressKey('6')">6</button>
          <button class="key" onclick="pressKey('7')">7</button>
          <button class="key" onclick="pressKey('8')">8</button>
          <button class="key" onclick="pressKey('9')">9</button>
          <button class="key" style="visibility: hidden;"></button>
          <button class="key" onclick="pressKey('0')">0</button>
          <button class="key delete-key" onclick="deleteKey()">⌫</button>
        </div>
        
        <button class="call-action-btn" id="dial-call-btn">📞</button>
        <p id="status-msg" style="font-size: 12px; color: var(--text-secondary); margin-top: 8px; height: 16px; text-align: center;"></p>
      </div>
    </div>

    <!-- 【画面2：電話帳】 -->
    <div id="screen-contacts" class="screen">
      <h3>電話帳</h3>
      <div style="background: #fafafa; border: 1px solid var(--border); padding: 12px; margin-bottom: 14px;">
        <input type="text" id="contact-name" class="input-field" placeholder="名前 (例: 山田さん)">
        <input type="text" id="contact-num" class="input-field" placeholder="番号（数字のみ）" maxlength="8">
        <!-- 修正：js側が紐付けているID「add-contact-btn」を付与 -->
        <button id="add-contact-btn" class="btn btn-success" style="padding: 8px; font-size: 14px;">連絡先を追加</button>
      </div>
      <ul id="contacts-list" class="card-list"></ul>
    </div>

    <!-- 【画面3：履歴】 -->
    <div id="screen-history" class="screen">
      <h3>通話履歴</h3>
      <ul id="history-list" class="card-list"></ul>
    </div>

    <!-- 【画面4：設定】 -->
    <div id="screen-settings" class="screen">
      <h3>設定</h3>
      <div style="background: #fafafa; border: 1px solid var(--border); padding: 16px; text-align: left;">
        <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 4px 0;">現在の電話番号</p>
        <p id="current-my-num" style="font-size: 18px; font-weight: bold; margin: 0 0 16px 0; color: var(--primary);"></p>
        
        <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 4px 0;">番号を変更する（数字のみ）</p>
        <input type="text" id="change-num-input" class="input-field" placeholder="新しい番号" maxlength="8">
        <button id="update-num-btn" class="btn btn-primary" style="padding: 8px; font-size: 14px; margin-bottom: 6px;">番号を更新する</button>
      </div>
    </div>

    <!-- ボトムメニューバー -->
    <div class="nav-bar">
      <button class="nav-item active-tab" onclick="switchTab('dial', this)">
        <span>⌨️</span><span>キーパッド</span>
      </button>
      <button class="nav-item" onclick="switchTab('contacts', this)">
        <span>📖</span><span>電話帳</span>
      </button>
      <button class="nav-item" onclick="switchTab('history', this)">
        <span>🕒</span><span>履歴</span>
      </button>
      <button class="nav-item" onclick="switchTab('settings', this)">
        <span>⚙️</span><span>設定</span>
      </button>
    </div>

    <!-- 【着信画面オーバーレイ】 -->
    <div id="incoming-overlay">
      <div>
        <p style="color: var(--text-secondary); font-size: 15px; margin-bottom: 8px;">着信中</p>
        <h2 id="incoming-number" style="font-size: 26px; margin: 0;"></h2>
      </div>
      <div style="display: flex; gap: 16px; justify-content: center; margin-bottom: 30px;">
        <button id="reject-btn" class="btn btn-danger" style="width: 110px; padding: 12px;">切る</button>
        <button id="accept-btn" class="btn btn-success" style="width: 110px; padding: 12px;">出る</button>
      </div>
    </div>

    <!-- 【通話中画面オーバーレイ】 -->
    <div id="incall-overlay">
      <div>
        <p id="incall-target" style="margin: 0; color: var(--text-secondary); font-size: 15px;">通話中</p>
        <p id="call-timer" style="font-size: 42px; font-weight: 300; margin: 12px 0;">00:00</p>
      </div>
      <div style="display: flex; justify-content: center; gap: 16px; margin-bottom: 30px;">
        <button id="hold-btn" class="btn" style="width: 90px; background: #3a3a3c; color: white;">保留</button>
        <button id="hangup-btn" class="btn btn-danger" style="width: 110px;">終話</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/token/dist/skyway_token-latest.js"></script>
  <script src="main.js"></script>
</body>
</html>
